<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supplier QR Code Form</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f2f2f2;
        color: #222;
    }

    .form-page {
        max-width: 850px;
        margin: 30px auto;
        background: white;
        padding: 35px;
        border-radius: 8px;
    }

    h1 {
        text-align: center;
        margin-top: 0;
    }

    .instructions {
        text-align: center;
        color: #555;
        margin-bottom: 30px;
    }

    .field {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 7px;
    }

    input {
        width: 100%;
        padding: 13px;
        font-size: 16px;
        border: 1px solid #aaa;
        border-radius: 5px;
    }

    button {
        padding: 13px 22px;
        font-size: 16px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 5px;
    }

    .generate {
        background: #222;
        color: white;
    }

    .clear {
        background: #ddd;
    }

    .buttons {
        text-align: center;
        margin: 25px 0;
    }

    #qr-section {
        display: none;
        margin-top: 30px;
    }

    .qr-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .qr-card {
        border: 1px solid #ccc;
        padding: 20px;
        text-align: center;
        min-height: 300px;
    }

    .qr-card h2 {
        font-size: 18px;
        margin-bottom: 8px;
    }

    .value {
        font-weight: normal;
        margin-bottom: 12px;
        word-break: break-word;
    }

    .qr-code {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 200px;
    }

    .print-button {
        text-align: center;
        margin-top: 25px;
    }

    @media (max-width: 650px) {
        .qr-grid {
            grid-template-columns: 1fr;
        }

        .form-page {
            margin: 0;
            border-radius: 0;
        }
    }

    @media print {

        body {
            background: white;
        }

        .form-page {
            margin: 0;
            padding: 10mm;
            max-width: none;
        }

        .instructions,
        .input-section,
        .print-button {
            display: none !important;
        }

        #qr-section {
            display: block !important;
            margin: 0;
        }

        .qr-grid {
            grid-template-columns: 1fr 1fr;
            gap: 12mm;
        }

        .qr-card {
            min-height: 0;
            height: 115mm;
            page-break-inside: avoid;
        }
    }
</style>

<!-- QR code library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<div class="form-page">

    <h1>Supplier QR Code Form</h1>

    <p class="instructions">
        Enter the four pieces of information below, then click
        "Generate QR Codes".
    </p>

    <div class="input-section">

        <div class="field">
            <label>PO Number</label>
            <input id="po" type="text" placeholder="Enter PO number">
        </div>

        <div class="field">
            <label>Product Code</label>
            <input id="product" type="text" placeholder="Enter product code">
        </div>

        <div class="field">
            <label>Quantity</label>
            <input id="quantity" type="text" placeholder="Enter quantity">
        </div>

        <div class="field">
            <label>Delivery Note</label>
            <input id="delivery" type="text" placeholder="Enter delivery note">
        </div>

        <div class="buttons">
            <button class="generate" onclick="generateQR()">
                Generate QR Codes
            </button>

            <button class="clear" onclick="clearForm()">
                Clear
            </button>
        </div>

    </div>

    <div id="qr-section">

        <div class="qr-grid">

            <div class="qr-card">
                <h2>PO Number</h2>
                <div class="value" id="po-value"></div>
                <div class="qr-code" id="po-qr"></div>
            </div>

            <div class="qr-card">
                <h2>Product Code</h2>
                <div class="value" id="product-value"></div>
                <div class="qr-code" id="product-qr"></div>
            </div>

            <div class="qr-card">
                <h2>Quantity</h2>
                <div class="value" id="quantity-value"></div>
                <div class="qr-code" id="quantity-qr"></div>
            </div>

            <div class="qr-card">
                <h2>Delivery Note</h2>
                <div class="value" id="delivery-value"></div>
                <div class="qr-code" id="delivery-qr"></div>
            </div>

        </div>

        <div class="print-button">
            <button class="generate" onclick="window.print()">
                Print / Save as PDF
            </button>
        </div>

    </div>

</div>

<script>

function makeQR(elementId, text) {

    const element = document.getElementById(elementId);

    element.innerHTML = "";

    new QRCode(element, {
        text: text,
        width: 180,
        height: 180,
        correctLevel: QRCode.CorrectLevel.M
    });
}


function generateQR() {

    const po =
        document.getElementById("po").value.trim();

    const product =
        document.getElementById("product").value.trim();

    const quantity =
        document.getElementById("quantity").value.trim();

    const delivery =
        document.getElementById("delivery").value.trim();


    if (!po || !product || !quantity || !delivery) {

        alert("Please complete all four fields.");

        return;
    }


    document.getElementById("po-value").textContent =
        po;

    document.getElementById("product-value").textContent =
        product;

    document.getElementById("quantity-value").textContent =
        quantity;

    document.getElementById("delivery-value").textContent =
        delivery;


    makeQR(
        "po-qr",
        "PO Number: " + po
    );

    makeQR(
        "product-qr",
        "Product Code: " + product
    );

    makeQR(
        "quantity-qr",
        "Quantity: " + quantity
    );

    makeQR(
        "delivery-qr",
        "Delivery Note: " + delivery
    );


    document.getElementById("qr-section").style.display =
        "block";
}


function clearForm() {

    document.getElementById("po").value = "";
    document.getElementById("product").value = "";
    document.getElementById("quantity").value = "";
    document.getElementById("delivery").value = "";

    document.getElementById("qr-section").style.display =
        "none";

    document.getElementById("po-qr").innerHTML = "";
    document.getElementById("product-qr").innerHTML = "";
    document.getElementById("quantity-qr").innerHTML = "";
    document.getElementById("delivery-qr").innerHTML = "";
}

</script>

</body>
</html>
